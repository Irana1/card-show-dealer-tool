<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Show Dealer Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pokemon Card Dealer Tool</h1>
    <h2>Buy Calculator</h2>
    <div>
        <form id="buy-calculator">
            <label for="buy-mkt-value">Market Value</label>
            <input type="number" id="buy-mkt-value">
            <p>Buy Percentage</p>
            <button type="button" class="buy-percentage-btn" data-percentage="70">70%</button>
            <button type="button" class="buy-percentage-btn" data-percentage="75">75%</button>
            <button type="button" class="buy-percentage-btn" data-percentage="80">80%</button>
            <button type="button" class="buy-percentage-btn" data-percentage="85">85%</button>
            <label for="buy-pct">Custom</label>
            <input type="number" id="buy-pct">
            <button type="submit">Calculate Offer</button>            
        </form>
    </div>
    <section>
        <span>Cash Offer:</span>
        <span id="buy-offer">$0.00</span>
    </section>
    <h2>Trade Calculator</h2>
    <div>
        <form id="trade-calculator">
            <label for="trade-mkt-value">Market Value</label>
            <input type="number" id="trade-mkt-value">
            <p>Trade Percentage</p>
            <button type="button" class="trade-percentage-btn" data-percentage="80">80%</button>
            <button type="button" class="trade-percentage-btn" data-percentage="85">85%</button>
            <button type="button" class="trade-percentage-btn" data-percentage="90">90%</button>   
            <label for="trade-pct">Custom</label>      
            <input type="number" id="trade-pct">
            <button type="submit">Calculate Offer</button>
        </form>
    </div>
    <section>
        <span>Trade Offer:</span>
        <span id="trade-offer">$0.00</span>
    </section>
    <h2>Profit Calculator</h2>
    <div>
        <form id="profit-calculator">
            <label for="purchase-cost">Purchase Cost</label>
            <input type="number" id="purchase-cost">
            <label for="sale-price">Sale Price</label>
            <input type="number" id="sale-price">
            <button type="submit">Calculate Profit</button>
        </form>
    </div>
    <section>
        <span>Profit:</span>
        <span id="profit-span">$0.00</span>
        <span>Profit Margin:</span>
        <span id="profit-margin-span">0.00%</span>
        <span>ROI:</span>
        <span id="roi-span">0.00%</span>
    </section>
    <h2>Pricing Tool</h2>
    <div>
        <form id="pricing-calculator">
            <div>
                <label for="pricing-mkt-value">Market Value</label>
                <input type="number" id="pricing-mkt-value">
                <button type="submit">Calculate Price</button>
            </div>
        </form>
    </div>
    <section>
        <span>Suggested Price:</span>
        <span id="suggested-price-span">$0.00</span>
    </section>
    <h2>Collection Buy Evaluator</h2>
    <div>
        <form id="collection-buy-evaluator">
            <label for="card-name">Card Name:</label>
            <input type="text" id="card-name">
            <label for="card-mkt-value">Market Value:</label>
            <input type="number" id="card-mkt-value">
            <button type="submit">Add Card</button>
        </form>
    </div>
    <section id="added-cards-container">

    </section>
    <section>
        <span>Total Market Value:</span>
        <span id="total-market-value-span"></span>
    </section>
    <script src="script.js"></script>
</body>
</html>
