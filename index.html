<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Show Dealer Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pokemon Card Dealer Tool</h1>
    <h2>Buy Calculator</h2>
    <div>
        <form id="buy-calculator">
            <label for="mkt-value">Market Value</label>
            <input type="number" id="mkt-value">
            <p>Buy Percentage</p>
            <button type="button" class="percentage-btn" data-percentage="70">70%</button>
            <button type="button" class="percentage-btn" data-percentage="75">75%</button>
            <button type="button" class="percentage-btn" data-percentage="80">80%</button>
            <button type="button" class="percentage-btn" data-percentage="85">85%</button>
            <label for="buy-pct">Custom</label>
            <input type="number" id="buy-pct">
            <button type="submit">Calculate Offer</button>            
        </form>
    </div>
    <section>
        <span>Cash Offer:</span>
        <span id="offer">$0.00</span>
    </section>
    <script src="script.js"></script>
</body>
</html>
